name: Build Windows EXE

# Builds a standalone TransferManagementSystem.exe with PyInstaller on
# every push to main / pull request (as a downloadable build artifact),
# and additionally publishes it as a GitHub Release asset whenever a
# tag like "v1.0.0" is pushed.

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sanity-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import + DB init smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "
          from app.database import init_db
          init_db()
          from app.views.main_window import MainWindow
          from PySide6.QtWidgets import QApplication
          app = QApplication([])
          w = MainWindow()
          for m in ['Dashboard', 'Transfers', 'Preparation', 'Release']:
              w._on_navigate(m)
              app.processEvents()
          print('Sanity check passed.')
          "

  build-windows-exe:
    needs: sanity-check
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build .exe with PyInstaller
        run: pyinstaller build.spec --noconfirm --clean

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransferManagementSystem-windows-exe
          path: dist/TransferManagementSystem.exe
          retention-days: 30

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TransferManagementSystem.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
